[package]
name = "taur-server"
description = "TAUR HTTP server (AUR RPC v5, git, snapshots, account API) and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taur"
path = "src/main.rs"

[dependencies]
taur-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde_urlencoded = "0.7"
clap_mangen = "0.2"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rand = { version = "0.10", features = ["thread_rng"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
flate2 = "1"
