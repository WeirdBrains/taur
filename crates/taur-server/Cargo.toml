[package]
name = "taur-server"
description = "TAUR HTTP server (AUR RPC v5, git, snapshots, account API) and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taur"
path = "src/main.rs"

[dependencies]
weirdnet-mcp.workspace = true
taur-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde_urlencoded = "0.7"
clap_mangen = "0.2"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rand = { version = "0.10", features = ["thread_rng"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
instant-acme = { version = "0.8.5", features = ["rcgen"] }
tokio-stream = "0.1"
rustls = { version = "0.23.46", features = ["ring", "std"] }
tokio-rustls = "0.26.6"
rustls-pemfile = "2.2.0"
rcgen = "0.14.10"
x509-parser = "0.18"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "server-auto"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile.workspace = true
http-body-util = "0.1"
flate2 = "1"
