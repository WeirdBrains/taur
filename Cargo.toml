[workspace]
resolver = "3"
members = ["crates/taur-core", "crates/taur-server", "crates/taur-cli"]

[workspace.package]
version = "1.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WeirdBrains/TAUR"

[workspace.dependencies]
taur-core = { path = "crates/taur-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
taur-server = { path = "crates/taur-server" }
# Tracking Weirdnet main during development; releases pin crates.io versions (AGENTS.md).
weirdnet-accounts = { git = "https://github.com/WeirdBrains/weirdnet-accounts", branch = "main" }
weirdnet-mcp = { git = "https://github.com/WeirdBrains/weirdnet-mcp", branch = "main" }
